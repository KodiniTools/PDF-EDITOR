    # ========== PDF-EDITOR (Static SPA, kein Backend, kein Port) ==========
    # Einfuegen im Server-Block von /etc/nginx/sites-enabled/kodinitools.com
    # (z. B. direkt nach dem TEXTEDITOR-Block), danach: nginx -t && systemctl reload nginx
    # Webroot: /var/www/kodinitools.com/pdf-editor/  ->  https://kodinitools.com/pdf-editor/

    # /pdf-editor (ohne Slash) -> /pdf-editor/
    location = /pdf-editor {
        return 301 /pdf-editor/;
    }

    # Vite-Assets mit Content-Hash im Dateinamen -> 1 Jahr immutable.
    # pdf.js-Worker ist eine .mjs-Datei: nginx kennt den Typ oft nicht und
    # liefert application/octet-stream -> der Browser verweigert den Worker.
    location ^~ /pdf-editor/assets/ {
        alias /var/www/kodinitools.com/pdf-editor/assets/;
        types {
            application/javascript js mjs;
            text/css               css;
            image/svg+xml          svg;
            font/woff2             woff2;
        }
        expires 1y;
        add_header Cache-Control          "public, immutable" always;
        add_header X-Content-Type-Options "nosniff"           always;
        access_log off;
        try_files $uri =404;
    }

    # SPA: index.html kurz cachen, History-Routen auf index.html zurueckfallen.
    location ^~ /pdf-editor/ {
        alias /var/www/kodinitools.com/pdf-editor/;
        index index.html;

        # add_header in dieser location ueberschreibt die Server-Header -> erneut einbinden
        include /etc/nginx/snippets/kodini-security.conf;

        add_header Cache-Control          "public, max-age=60, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                             always;

        try_files $uri $uri/ /pdf-editor/index.html;
    }
