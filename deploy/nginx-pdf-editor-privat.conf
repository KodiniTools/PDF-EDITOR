    # ========== PDF-EDITOR PRIVAT (SPA + API-Proxy, mit Basic Auth) ==========
    # Einfuegen im Server-Block von /etc/nginx/sites-enabled/kodinitools.com
    # (z. B. direkt nach dem PDF-EDITOR-Block), danach: nginx -t && systemctl reload nginx
    # Webroot: /var/www/kodinitools.com/pdf-editor-privat/  ->  https://kodinitools.com/pdf-editor-privat/
    # Backend: systemd-Service pdf-editor-privat-api auf 127.0.0.1:3417
    #          (Port muss zu PORT in /etc/kodini/pdf-editor-privat-api.env passen!)
    #
    # Zugangsdaten einmalig anlegen (apache2-utils):
    #   sudo htpasswd -c -B /etc/nginx/.htpasswd-pdf-editor-privat kodini
    # ohne apache2-utils:
    #   printf 'kodini:%s\n' "$(openssl passwd -6)" | sudo tee /etc/nginx/.htpasswd-pdf-editor-privat
    #   sudo chown root:www-data /etc/nginx/.htpasswd-pdf-editor-privat && sudo chmod 640 /etc/nginx/.htpasswd-pdf-editor-privat

    # /pdf-editor-privat (ohne Slash) -> /pdf-editor-privat/ (Auth greift danach im Block unten)
    location = /pdf-editor-privat {
        return 301 /pdf-editor-privat/;
    }

    location ^~ /pdf-editor-privat/ {
        # --- Zugriffsschutz fuer ALLES darunter (Seite, Assets, API) ---
        auth_basic           "Kodini privat";
        auth_basic_user_file /etc/nginx/.htpasswd-pdf-editor-privat;

        alias /var/www/kodinitools.com/pdf-editor-privat/;
        index index.html;

        # Eigene Sicherheits-Header statt kodini-security.conf: MuPDF braucht
        # 'wasm-unsafe-eval' (WebAssembly), das eine allgemeine CSP meist nicht erlaubt.
        # (add_header in einer location ersetzt alle geerbten Header.)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options        "DENY"                  always;
        add_header Referrer-Policy        "no-referrer"           always;
        add_header X-Content-Type-Options "nosniff"               always;
        add_header X-Robots-Tag           "noindex, nofollow"     always;
        add_header Cache-Control          "no-cache"              always;

        try_files $uri $uri/ /pdf-editor-privat/index.html;

        # Vite-Assets mit Content-Hash -> lange cachen (nur im Browser: "private").
        # .mjs (pdf.js-Worker) und .wasm (MuPDF) brauchen den richtigen MIME-Typ.
        location ^~ /pdf-editor-privat/assets/ {
            alias /var/www/kodinitools.com/pdf-editor-privat/assets/;
            types {
                application/javascript js mjs;
                application/wasm       wasm;
                text/css               css;
                image/svg+xml          svg;
                font/woff2             woff2;
            }
            expires 1y;
            add_header Cache-Control          "private, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff"                              always;
            add_header X-Robots-Tag           "noindex, nofollow"                    always;
            access_log off;
            try_files $uri =404;
        }

        # API -> Node-Backend (nur localhost). Prefix wird abgeschnitten:
        # /pdf-editor-privat/api/xyz -> http://127.0.0.1:3417/api/xyz
        location ^~ /pdf-editor-privat/api/ {
            proxy_pass http://127.0.0.1:3417/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Basic-Auth-Zugangsdaten nicht an das Backend weiterreichen.
            proxy_set_header Authorization     "";

            client_max_body_size 1m;   # passt zu MAX_BODY_BYTES im Backend
            proxy_read_timeout   210s; # Backend bricht KI-Aufrufe nach 180 s ab
            proxy_send_timeout   60s;

            add_header Cache-Control          "no-store"          always;
            add_header X-Content-Type-Options "nosniff"           always;
            add_header X-Robots-Tag           "noindex, nofollow" always;
        }
    }
